<!DOCTYPE html>

  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app"></main>

  <div id="timer" class="timer hidden" aria-live="polite"></div>

    <button data-act="tab" data-tab="gym"><svg viewBox="0 0 24 24"><path d="M2 10h2V8h2v8H4v-2H2zm4-4h3v12H6zm9 0h3v12h-3zm3 2h2v2h2v4h-2v2h-2zM9 11h6v2H9z"/></svg><span>Gym</span></button>

  </nav>

  <input type="file" id="importFile" hidden>

  <script src="data.js"></script>
  <script src="app.js"></script>

</html>
